<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | LensCraft Photography</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

  <!-- Navbar -->
  <nav class="bg-black border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold tracking-widest">
        Lens<span class="text-yellow-400">Craft</span>
      </a>

      <div class="space-x-8">
        <a href="index.html" class="hover:text-yellow-400">Home</a>
        <a href="gallery.html" class="text-yellow-400">Gallery</a>
        <a href="booking.html" class="hover:text-yellow-400">Booking</a>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <section class="py-20 text-center">
    <p class="text-yellow-400 uppercase tracking-[5px]">
      Our Portfolio
    </p>

    <h1 class="text-5xl font-bold mt-4">
      Captured <span class="text-yellow-400">Moments</span>
    </h1>

    </p>

  <section class="max-w-7xl mx-auto px-6 pb-24">

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">

      <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=900&q=80"

      <img src="https://images.unsplash.com/photo-1606800052052-a08af7148866?auto=format&fit=crop&w=900&q=80"

      <img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e?auto=format&fit=crop&w=900&q=80"
           class="w-full h-80 object-cover rounded-xl hover:scale-105 transition duration-500">

      <img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=900&q=80"
           class="w-full h-80 object-cover rounded-xl hover:scale-105 transition duration-500">

    </div>

  <footer class="border-t border-zinc-800 py-8 text-center text-gray-500">
    © 2026 LensCraft Photography

</html>
